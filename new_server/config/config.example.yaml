# config.example.yaml — 配置模板
#
# 真正的 config.yaml 不进版本库（含数据库密码与 token 密钥），换机器部署时
# 复制本文件为 config.yaml 再把尖括号占位符填上。
# deploy/ 下第三方程序的配置同理，各有一份 *.example.*。

# 数据库配置
db:
  host: 127.0.0.1
  port: 3306
  name: syncfile
  user: syncfile
  password: "<数据库密码>"

# 缓存配置
redis:
  host: 127.0.0.1
  port: 6379
  db: 0

#日志配置
log:
  path: ./log
  level: debug
  format: json
  console: true
  file: true
# 日志文件最大大小（MB）
  max_size: 100
  # 日志文件最大年龄（天）
  max_age: 7
  # 日志文件最大备份数量
  max_backup: 3

# 白名单路由配置，该路由下的请求无需登录认证即可访问
# 需与路由注册路径保持一致（含 /v1 前缀）；支持精确匹配或前缀匹配（如 /v1/public 会放行 /v1/public/xxx）
whitelist:
  - /v1/ping
  - /v1/user/register
  - /v1/user/login
  - /v1/user/reset-password
  - /v1/user/verify
  - /v1/file/share-link/download

# 认证配置
auth:
  enabled: true
#  token有效时间（天）
  token_expire: 7
#  自动刷新时间（天）
  refresh_expire: 1
#  token密钥
  secret: "<随机字符串，务必改掉；泄露等于任何人都能伪造 token>"

#  服务器配置
server:
  port: 8991
  # 节点名：随 /v1/ping 回给客户端，桌面端灾备面板上显示「当前连的是哪个入口」。
  # 留空则用主机名。多台机器各自部署时给不同的名字。
  name: ""

# 文件存储配置
file:
  # 允许的存储路径（Windows 盘符或 Linux 挂载点）
  allowed_paths:
    - "D:"
    - "E:"
    - "F:"
    - "G:"
  # 存储目录
  storage:
    base_path: "FileSync"
    upload_path: "uploads"
    temp_path: "temp"
    trash_path: "trash"
  # 上传配置
  upload:
    max_file_size: 10737418240     # 最大文件大小 10GB（字节）
    max_filename_length: 255       # 最大文件名长度
    # 扩展名策略：allowed_extensions 不写=允许所有；forbidden_extensions 默认空，按需添加
    # forbidden_extensions:
    #   - ".exe"

# 用户配置
user:
  avatar_path: "static/avatar"
  allowed_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".bmp"
    - ".webp"
    - ".svg"
    - ".tiff"
    - ".ico"
    - ".svgz"
    - ".tga"
    - ".dds"
    - ".exr"
    - ".hdr"
    - ".exe"
    - ".dll"
    - ".so"
    - ".dy"
    - ".a"
    - ".o"
    - ".db"
  max_size: 50485760              # 最大头像大小 50MB（字节）

# 分享链接配置
share:
  # 临时文件目录：创建分享链接时把源文件硬链接到此目录
  temp_path: "E:/fileSynchronization/temp/"
  # 分享链接最大有效期（分钟）
  max_expire_minutes: 43200
  # 定时扫描过期分享链接的间隔（分钟）
  clean_interval_minutes: 30
  #
  # 下载接口 GET /v1/file/share-link/download/:code 每次访问都会重新校验有效期/状态；
  # 校验通过后是 Go 自己吐文件、还是丢给 nginx 用 sendfile 吐文件，是按请求头
  # X-Via-Nginx 自动判断的（由 nginx 的 /file/ location 用 proxy_set_header 强制打上，
  # 客户端自己带这个头没用，会被 proxy_set_header 覆盖），不需要在这里配置开关——
  # 同一个 Go 进程要同时服务网页端（走 nginx）和 Tauri 桌面端（直连本服务，没有 nginx），
  # 全局开关没法同时满足两边。
  # nginx 侧需要新增一段 internal location（浏览器无法直接访问，只能被本服务通过
  # X-Accel-Redirect 内部调度到）：
  #
  #   location /internal-temp/ {
  #       internal;
  #       alias E:/fileSynchronization/temp/;
  #   }
  #
  # 并在现有 /file/ 反代 location 里加一行：
  #
  #   proxy_set_header X-Via-Nginx "1";

# 粘贴快传配置：剪贴板粘贴文件 → 自动传到该账号的专属子目录 → 立即生成分享链接
quick_share:
  # 子目录根：系统会在这里按 base_path/<user_id>/ 自动分配每个用户的专属目录，
  # 用户中心看不到也改不了这个路径（和 share.temp_path 是两个独立目录，quick-share
  # 内容不出现在文件浏览器里，也不参与同步引擎）
  base_path: "E:/fileSynchronization/quickshare/"
  # 每个用户当前有效（未过期/未吊销）的 quick-share 内容总大小上限，默认 10GB。
  # 个人使用场景，觉得不够可以调大
  max_capacity_bytes: 10737418240
  # 粘贴内容不超过这个大小就直接放内存里模拟磁盘，不落盘；超过才落盘到 base_path/<user_id>/
  memory_threshold_bytes: 20971520
  # 粘贴上传后分享链接的默认有效期（分钟），用户中心可以覆盖成自己的值
  default_expire_minutes: 60

# 文件同步引擎配置
sync:
  worker_concurrency: 4          # worker goroutine 数量
  max_retry: 3                   # 任务最大重试次数
  lock_ttl_seconds: 300          # 文件锁 TTL（秒）
  queue_timeout_seconds: 5       # BRPOP 阻塞超时（秒）
  task_timeout_seconds: 600      # 单任务执行超时（秒），超时后重试
  conflict_suffix: "conflict"    # 冲突文件保留后缀
  sync_catalogue: "F:/同步目录/"  # 执行实时同步的目录

# ── 外部进程托管 ──────────────────────────────────────────────────────────────
# 后端启动时自动拉起内网穿透与动态域名，退出时一并关闭（见 internal/supervisor）。
#
# 为什么归到后端：frpc 一断，两个域名就全都打不进来，而现象只是"服务好好的但访问不了"。
# 以前靠 start.bat 甩出几个控制台窗口，失败不可见、死了不重启、没有日志。
#
# command 用的是各程序自己的安装路径（exe 是二进制，不进本仓库）；
# args 里的配置文件则统一收在 deploy/ 下，相对路径按后端工作目录解析。
supervisor:
  enabled: true
  # 子进程 stdout/stderr 落盘位置
  log_dir: ./log/supervisor
  processes:
    # 主入口：13.193.51.91，local 443 → remote 443（ddns.sunyuanling.cn）
    - name: frpc-ddns
      enabled: true
      command: "E:/内网穿透/frp/frpc.exe"
      args: ["-c", "deploy/frp/frpc.toml"]
      # 必须开：frpc 用同样的 proxy 名重复连同一个 frps 会被拒绝
      # （proxy [xxx] already exists），新旧客户端谁都用不上
      skip_if_running: true
      restart_delay_seconds: 10
    # 备用入口：151.242.164.110 东京，local 443 → remote 8443（jp.sunyuanling.cn:8443）
    - name: frpc-tokyo
      enabled: true
      command: "E:/内网穿透/frp/frpc.exe"
      args: ["-c", "deploy/frp/frpc_akile.toml"]
      skip_if_running: true
      restart_delay_seconds: 10
    # 动态域名：只更新 ddns.sunyuanling.cn 的 AAAA（家宽 IPv6 会变）；
    # A 记录固定指向 VPS 走 frp，不需要更新，所以配置里 ipv4.enable = false
    - name: ddns-go
      enabled: true
      command: "F:/proxy/ddns/ddns-go.exe"
      args: ["-c", "deploy/ddns/ddns_go_config.yaml"]
      skip_if_running: true
      restart_delay_seconds: 30
