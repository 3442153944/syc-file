[package]
name = "sync_core"
version = "0.2.0"
edition = "2021"
description = "Compatibility artifact for sys_core: stable Go C ABI"
[lib]
crate-type = ["staticlib", "rlib"]
[dependencies]
sys_core = { path = "../../sys_core" }
[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "unwind"
