name: 桌面端打包（Windows / macOS / Linux）

# Tauri 应用不能跨平台编译出对应平台的安装包——.dmg/.app 得在真的 macOS 上打，
# .deb/.AppImage 得在真的 Linux 上打（依赖各自平台的系统库，比如 webkit2gtk）。
# 本机是 Windows，只能出 Windows 包；三端一起出，标准做法就是这种 CI 矩阵构建：
# 三个 runner 各自在自己的系统上跑一遍 `tauri build`，产物再统一收集起来。
#
# 触发方式：手动点「Run workflow」，或者推一个 desktop-v* 开头的 tag（如 desktop-v0.1.0）。
# 产物以 workflow artifact 的形式保留 30 天，供下载，不会自动发布成公开的 GitHub Release
# ——要不要正式发布、发不发布给所有人看，这个决定留给你自己在 Actions 页面里操作。

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            rust-targets: ''
            tauri-args: ''
          - platform: macos-latest
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            tauri-args: '--target universal-apple-darwin'
          # 22.04 而不是 latest：Linux 下打出来的包里链接的 glibc 版本跟 runner 系统版本
          # 走，选旧一点的发行版能让打出来的包在更多用户的机器上跑得起来。
          - platform: ubuntu-22.04
            rust-targets: ''
            tauri-args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 打包依赖（webkit2gtk / 托盘图标等）
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            libxdo-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: filesync-desktop/pnpm-lock.yaml

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust 依赖缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: filesync-desktop/src-tauri

      - name: 安装前端依赖
        working-directory: filesync-desktop
        run: pnpm install --frozen-lockfile

      - name: 构建
        working-directory: filesync-desktop
        run: pnpm tauri build ${{ matrix.tauri-args }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: filesync-desktop-${{ matrix.platform }}
          path: |
            filesync-desktop/src-tauri/target/release/bundle/**
            filesync-desktop/src-tauri/target/*/release/bundle/**
          if-no-files-found: error
          retention-days: 30
