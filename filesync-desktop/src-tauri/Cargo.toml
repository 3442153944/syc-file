[package]
name = "filesync-desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "filesync_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
# 单实例：再次启动（点 Dock 图标 / 应用菜单）时把已运行实例的主窗口叫出来，而不是再起一个进程。
# 只在 release 构建里启用（见 lib.rs）：debug 与 release 的标识符相同，dev 启用会被已安装的实例"吃掉"。
tauri-plugin-single-instance = "2"
# 说明：曾经短暂把 tauri/tauri-plugin-dialog/tauri-plugin-global-shortcut 精确锁过版本，
# 因为当时 cargo 解析出的 tauri-runtime-wry 2.10.1 + wry 0.54.2 这个组合编不过（缺
# eval_script_with_callback 实现、闭包 Send+Sync 约束不满足）。后来验证过，那只是
# 2.10.1 这一个具体版本的问题，tauri-runtime-wry 2.11.4（随当前 tauri 2.11.x 解出）
# 已经修好了，所以改回宽松版本号即可，不需要精确锁定。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
parking_lot = "0.12"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["multipart", "stream", "json"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
blake3 = "1.5"
hex = "0.4"
serde_yaml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
arboard = "3.6.1"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
# 多路径自适应上传决策核心（rlib 进程内调用：测速编排/父链折算/选片/AIMD 窗口/动态超时/多路调度）。
# 它带 sysinfo/netstat2 依赖属正常；HTTP 发送仍归本平台（见 chunked_uploader.rs）。
sync_core = { path = "../../new_server/sync_core" }

